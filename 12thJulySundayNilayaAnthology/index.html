<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privé - Invitation Only</title>
    <meta name="description" content="An invitation-only gathering to shape what is coming next">
    <meta name="framer-search-index"
        content="https://framerusercontent.com/sites/4at4Ai9iEuEoC5V4gZMIKA/searchIndex-Y2jjl4QiYM0x.json">
    <meta name="framer-search-index-fallback"
        content="https://framerusercontent.com/sites/4at4Ai9iEuEoC5V4gZMIKA/searchIndex-zyGarmXwJA30.json">
    <meta name="framer-html-plugin" content="disable">
    <link href="https://framerusercontent.com/images/SkWS9oa1yKP5DYKrl6X1fMUXvY.png" rel="icon"
        media="(prefers-color-scheme: light)">
    <link href="https://framerusercontent.com/images/SkWS9oa1yKP5DYKrl6X1fMUXvY.png" rel="icon"
        media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="https://framerusercontent.com/images/EaB0dELqxZsAltOXbwtQceWH2L0.png">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Privé">
    <meta property="og:description" content="An invitation-only gathering to shape what is coming next">
    <meta property="og:image" content="https://framerusercontent.com/images/u7kv3dzKD9blE0w5f4CfUcZwVO4.webp">
    <!-- X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Privé">
    <meta name="twitter:description" content="An invitation-only gathering to shape what is coming next">
    <meta name="twitter:image" content="https://framerusercontent.com/images/u7kv3dzKD9blE0w5f4CfUcZwVO4.webp">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        prive: {
                            gold: '#C5A859',
                            dark: '#1A1A1A',
                            text: '#333333'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .backdrop-blur-2xl {
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        .backdrop-blur-3xl {
            backdrop-filter: blur(64px);
            -webkit-backdrop-filter: blur(64px);
        }

        .backdrop-blur-xl {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        input:focus {
            border-color: #C9A227 !important;
            outline: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .animate-pulse {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        #success-popup {
            display: none;
        }

        #success-popup.active {
            display: flex;
        }

        /* Submit button states */
        #submit-btn {
            transition: opacity 0.25s ease;
        }
        #submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Phone validation hint */
        #phone-error {
            display: none;
            color: #E5A3A3;
            font-size: 12px;
            margin-top: 4px;
            padding-left: 4px;
        }
        #phone-error.show {
            display: block;
        }

        /* Attendance option selector */
        .attend-label {
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.75);
        }

        /* Always two columns — same on mobile and desktop */
        .attend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .attend-option {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 56px;
            padding: 8px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.20);
            background-color: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.85);
            /* auto-scales: min 11px on tiny phones, up to 13px on desktop */
            font-size: clamp(11px, 3vw, 13px);
            line-height: 1.3;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .attend-option:hover {
            border-color: rgba(201,162,39,0.55);
        }

        .attend-radio {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .attend-radio:checked + .attend-option {
            border-color: #C9A227;
            background-color: rgba(201,162,39,0.15);
            color: #ffffff;
            font-weight: 600;
        }

        /* Responsive typography */
        .card-title { font-size: 1.5rem; }
        .card-subtitle { font-size: 1.05rem; }

        @media (min-width: 480px) {
            .card-title { font-size: 1.875rem; }
            .card-subtitle { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <main class="relative min-h-screen overflow-hidden">

        <!-- BACKGROUND IMAGE -->
        <div
            class="absolute inset-0 bg-cover bg-center"
            style="background-image: url('../assets/images/back-bg.webp');"
        ></div>

        <!-- Dark Overlay -->
        <div class="absolute inset-0" style="background-color: rgba(0,0,0,0.55);"></div>

        <!-- Main Content -->
        <div class="relative z-10 flex min-h-screen items-center justify-center px-4 sm:px-6 py-8">
            <div class="w-full max-w-[500px] flex flex-col items-center ">

                <!-- Form Card -->
                <div class="w-full rounded-3xl border border-white/10 p-5 sm:p-6 shadow-2xl backdrop-blur-2xl"
                    style="background-color: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.10);">

                    <h2 class="card-title text-center text-white mb-3" style="font-weight: 400;">
                        Nilaya Anthology, Lower Parel, Mumbai
                    </h2>
                    <h2 class="card-subtitle text-center text-white mb-4" style="font-weight: 400;">
                        12th July, 7.00 pm - 10.00 pm
                    </h2>

                    <form id="prive-form" class="space-y-3" onsubmit="handleSubmit(event)">

                        <input
                            type="text"
                            name="firstName"
                            id="firstName"
                            placeholder="First Name"
                            required
                            class="w-full rounded-xl px-4 py-3 text-white outline-none"
                            style="border: 1px solid rgba(255,255,255,0.20); background-color: rgba(255,255,255,0.05); color: white;"
                        />

                        <input
                            type="text"
                            name="lastName"
                            id="lastName"
                            placeholder="Last Name"
                            required
                            class="w-full rounded-xl px-4 py-3 text-white outline-none"
                            style="border: 1px solid rgba(255,255,255,0.20); background-color: rgba(255,255,255,0.05); color: white;"
                        />

                        <div>
                            <input
                                type="tel"
                                name="phone"
                                id="phone"
                                placeholder="Phone Number (10 digits)"
                                required
                                inputmode="numeric"
                                maxlength="10"
                                autocomplete="tel"
                                class="w-full rounded-xl px-4 py-3 text-white outline-none"
                                style="border: 1px solid rgba(255,255,255,0.20); background-color: rgba(255,255,255,0.05); color: white;"
                            />
                            <p id="phone-error">Please enter a valid 10-digit phone number.</p>
                        </div>

                        <!-- ATTENDANCE QUESTION -->
                        <div class="pt-1">
                            <div class="attend-grid">
                                <label>
                                    <input class="attend-radio" type="radio" name="attendance" value="I will drop by alone" required>
                                    <span class="attend-option">I will drop by alone</span>
                                </label>
                                <label>
                                    <input class="attend-radio" type="radio" name="attendance" value="my wife and i will join in">
                                    <span class="attend-option">My wife and i will join in</span>
                                </label>
                                <label>
                                    <input class="attend-radio" type="radio" name="attendance" value="we will join with our adult children">
                                    <span class="attend-option">We will join with our adult children</span>
                                </label>
                                <label>
                                    <input class="attend-radio" type="radio" name="attendance" value="I am unable to join in">
                                    <span class="attend-option">I am unable to join in</span>
                                </label>
                            </div>
                        </div>

                        <button
                            type="submit"
                            id="submit-btn"
                            disabled
                            class="mt-3 w-full rounded-xl py-3 font-semibold"
                            style="background-color: #C9A227; color: black; font-weight: 600;"
                        >
                            Submit
                        </button>
                    </form>
                </div>

            </div>
        </div>

        <!-- SUCCESS POPUP -->
        <div id="success-popup"
            class="fixed inset-0 z-50 items-center justify-center px-4 sm:px-6"
            style="background-color: rgba(0,0,0,0.50); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);">

            <div class="w-full max-w-md overflow-hidden rounded-3xl p-6 text-center flex flex-col items-center"
                style="border: 1px solid rgba(255,255,255,0.10); background-color: rgba(255,255,255,0.10); backdrop-filter: blur(64px); -webkit-backdrop-filter: blur(64px); box-shadow: 0 30px 80px rgba(0,0,0,0.5);">

                <!-- Gold Circle -->
                <div class="mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-full"
                    style="border: 1px solid rgba(201,162,39,0.40); background-color: rgba(201,162,39,0.10);">
                    <span class="text-4xl" style="color: #C9A227;">✓</span>
                </div>

                <!-- Heading -->
                <h2 class="mb-3 text-3xl font-light text-white" style="font-weight: 300;">
                    Submitted Successfully
                </h2>

                <!-- Divider -->
                <div class="mx-auto mb-4" style="height: 1px; width: 64px; background-color: rgba(201,162,39,0.40);"></div>

                <!-- Description -->
                <p class="text-sm text-gray-300" style="line-height: 1.75;">
                    Thank you, your response has been recorded.
                </p>

            </div>
        </div>

    </main>

    <script>
        // Style placeholders white
        const style = document.createElement('style');
        style.textContent = `
            input::placeholder { color: rgba(255,255,255,0.85); }
            input:focus { border-color: #C9A227 !important; }
        `;
        document.head.appendChild(style);

        // ---- Elements ----
        const submitBtn = document.getElementById('submit-btn');
        const phoneInput = document.getElementById('phone');
        const phoneError = document.getElementById('phone-error');

        // Keep only digits and cap at 10 as the user types / pastes
        phoneInput.addEventListener('input', function () {
            const digitsOnly = phoneInput.value.replace(/\D/g, '').slice(0, 10);
            if (phoneInput.value !== digitsOnly) {
                phoneInput.value = digitsOnly;
            }
            updatePhoneError();
            checkFormValidity();
        });

        function isPhoneValid() {
            return /^\d{10}$/.test(phoneInput.value.trim());
        }

        function updatePhoneError() {
            const val = phoneInput.value.trim();
            // Show hint only if something is typed but it's not yet 10 digits
            if (val.length > 0 && !isPhoneValid()) {
                phoneError.classList.add('show');
            } else {
                phoneError.classList.remove('show');
            }
        }

        // ---- Enable submit only when all four fields are valid ----
        function checkFormValidity() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName  = document.getElementById('lastName').value.trim();
            const attendance = document.querySelector('input[name="attendance"]:checked');

            const allValid = firstName && lastName && isPhoneValid() && attendance;
            submitBtn.disabled = !allValid;   // CSS handles opacity + cursor
        }

        // Watch text inputs
        ['firstName', 'lastName'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', checkFormValidity);
        });
        // Watch attendance radios
        document.querySelectorAll('input[name="attendance"]').forEach(function (r) {
            r.addEventListener('change', checkFormValidity);
        });
        // Set initial state
        checkFormValidity();

        // Hover feedback only when enabled
        submitBtn.addEventListener('mouseover', function () {
            if (!submitBtn.disabled) submitBtn.style.opacity = '0.9';
        });
        submitBtn.addEventListener('mouseout', function () {
            if (!submitBtn.disabled) submitBtn.style.opacity = '1';
        });

async function handleSubmit(e) {
    e.preventDefault();

    // Safety guard: don't submit if somehow triggered while incomplete/invalid
    checkFormValidity();
    if (submitBtn.disabled) {
        updatePhoneError();
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

// ← paste your Web App URL here
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvDRP4VXg5S7sjioxgtdE0Pt4RAqcmQ4ZcCrV7xAXU9wXBHJOj9eZjXlG0_NMbfS1_/exec'; // ← paste your Web App URL here

    const attendanceEl = document.querySelector('input[name="attendance"]:checked');

    const params = new URLSearchParams({
        firstName:  document.getElementById('firstName').value,
        lastName:   document.getElementById('lastName').value,
        phone:      document.getElementById('phone').value,
        attendance: attendanceEl ? attendanceEl.value : '',
    });

    try {
        await fetch(`${SCRIPT_URL}?${params.toString()}`, {
            method: 'GET',  // GET with query params — works reliably with no-cors
            mode: 'no-cors',
        });
    } catch (err) {
        console.error('Sheet submission failed:', err);
    }

    // Show success popup and stay on the page (no redirect)
    const popup = document.getElementById('success-popup');
    popup.classList.add('active');
}
    </script>

</body>
</html>
