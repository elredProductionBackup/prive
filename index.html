<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privé - Invitation Only</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&family=Lora:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        prive: {
                            gold: '#C5A859',
                            dark: '#1A1A1A',
                            text: '#333333'
                        }
                    },
                    fontFamily: {
                        'logo': ['"Playfair Display"', 'serif'],
                        'heading': ['"Lora"', 'serif'],
                        'body': ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-white min-h-screen flex flex-col items-center justify-center p-6 antialiased selection:bg-prive-gold selection:text-white">

    <main class="max-w-[840px] w-full flex flex-col items-center text-center">

        <h1 class="font-logo font-bold text-prive-gold text-[42px] md:text-[54px] tracking-wide mb-8 md:mb-14">
            Privé
        </h1>

        <h2 class="font-heading text-prive-dark text-[28px] md:text-[44px] leading-[1.3] md:leading-[1.25] mb-12 md:mb-20 px-2 md:px-0 mx-auto max-w-[760px]">
            An invitation-only gathering for UHNI operators and investors shaping what comes next.
        </h2>

        <p class="font-body italic text-prive-text text-[15px] md:text-[18px] mb-8 md:mb-10">
            Participation is currently being extended on an invited basis.
        </p>

        <div id="openModalBtn" role="button" tabindex="0" class="flex flex-col items-center cursor-pointer group">
            <div class="w-14 h-14 md:w-16 md:h-16 rounded-full border border-prive-gold flex items-center justify-center mb-3 transition-colors duration-300 group-hover:bg-amber-50">

                <svg width="20" height="22" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    class="text-prive-gold w-5 h-5 md:w-6 md:h-6">

                    <rect x="5" y="11" width="14" height="10" rx="2"
                        stroke="currentColor"
                        stroke-width="1.5" />

                    <path d="M8 11V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V11"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round" />

                    <circle cx="12" cy="16" r="1.5" fill="currentColor" />
                </svg>
            </div>

            <span class="font-body text-prive-dark text-[15px] md:text-[16px] tracking-wide">
                Access
            </span>
        </div>

    </main>

    <!-- Access Modal -->
    <div id="accessModal"
        class="fixed inset-0 z-50 hidden opacity-0 transition-opacity duration-300"
        aria-labelledby="modal-title"
        role="dialog"
        aria-modal="true">

        <!-- Backdrop -->
        <div id="modalBackdrop"
            class="absolute inset-0 bg-black/40 backdrop-blur-sm cursor-pointer">
        </div>

        <!-- Modal -->
        <div class="fixed inset-0 flex items-center justify-center p-4 pointer-events-none">

            <div id="modalContent"
                class="bg-white rounded-xl p-8 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300 relative pointer-events-auto">

                <!-- Close -->
                <button id="closeModalBtn"
                    class="absolute top-4 right-4 text-gray-400 hover:text-gray-800 transition-colors"
                    aria-label="Close modal">

                    <svg class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>

                <h3 id="modal-title"
                    class="font-heading text-prive-dark text-[24px] mb-2 text-center">
                    Secure Access
                </h3>

                <p class="font-body text-gray-500 text-[14px] mb-6 text-center">
                    Please enter your secret code.
                </p>

                <form id="accessForm" class="flex flex-col gap-4">

                    <input
                        id="secretInput"
                        type="password"
                        required
                        placeholder="Secret Code"
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:border-prive-gold focus:ring-1 focus:ring-prive-gold font-body text-center tracking-[0.2em] transition-colors"
                    />

                    <p id="errorText"
                        class="hidden text-red-500 text-[13px] text-center">
                        Invalid access code
                    </p>

                    <button
                        type="submit"
                        class="w-full bg-prive-gold text-white font-body font-medium py-3 rounded-lg hover:bg-[#b0964d] transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-prive-gold">

                        Get Access
                    </button>

                </form>
            </div>
        </div>
    </div>

    <script>

        /*
        ==========================================
        CONFIG
        ==========================================
        */

        const ACCESS_CODES = [
            "saurabh",
        ];

        // CHANGE THIS
        // your actual protected framer page
        const REDIRECT_URL = "./home/index.html";



        /*
        ==========================================
        AUTO LOGIN
        ==========================================
        */

        if (localStorage.getItem("prive_access") === "granted") {
            window.location.href = REDIRECT_URL;
        }



        /*
        ==========================================
        ELEMENTS
        ==========================================
        */

        const modal = document.getElementById('accessModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const backdrop = document.getElementById('modalBackdrop');
        const modalContent = document.getElementById('modalContent');
        const accessForm = document.getElementById('accessForm');

        const input = document.getElementById('secretInput');
        const errorText = document.getElementById('errorText');


        /*
        ==========================================
        MODAL FUNCTIONS
        ==========================================
        */

        function openModal() {
            modal.classList.remove('hidden');

            void modal.offsetWidth;

            modal.classList.remove('opacity-0');

            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');

            setTimeout(() => {
                input.focus();
            }, 100);
        }

        function closeModal() {

            modal.classList.add('opacity-0');

            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {

                modal.classList.add('hidden');

                accessForm.reset();

                input.classList.remove('border-red-400', 'text-red-500');

                errorText.classList.add('hidden');

            }, 300);
        }



        /*
        ==========================================
        EVENTS
        ==========================================
        */

        openBtn.addEventListener('click', openModal);

        closeBtn.addEventListener('click', closeModal);

        backdrop.addEventListener('click', closeModal);

        openBtn.addEventListener('keydown', (e) => {

            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openModal();
            }
        });

        document.addEventListener('keydown', (e) => {

            if (
                e.key === 'Escape' &&
                !modal.classList.contains('hidden')
            ) {
                closeModal();
            }
        });



        /*
        ==========================================
        AUTH LOGIC
        ==========================================
        */

        accessForm.addEventListener('submit', (e) => {

            e.preventDefault();

            const btn = accessForm.querySelector('button');

            const originalText = btn.innerText;

            btn.innerText = 'Verifying...';

            btn.classList.add('opacity-80', 'cursor-not-allowed');

            const enteredCode = input.value.trim();

            setTimeout(() => {

                /*
                SUCCESS
                */

                if (ACCESS_CODES.includes(enteredCode)) {

                    // save access
                    localStorage.setItem(
                        "prive_access",
                        "granted"
                    );

                    btn.innerText = 'Access Granted';

                    // redirect
                    setTimeout(() => {
                        window.location.href = REDIRECT_URL;
                    }, 500);

                    return;
                }



                /*
                ERROR
                */

                btn.innerText = originalText;

                btn.classList.remove(
                    'opacity-80',
                    'cursor-not-allowed'
                );

                input.classList.add(
                    'border-red-400',
                    'text-red-500'
                );

                errorText.classList.remove('hidden');

                setTimeout(() => {

                    input.classList.remove(
                        'border-red-400',
                        'text-red-500'
                    );

                    errorText.classList.add('hidden');

                    input.value = '';

                }, 1500);

            }, 800);
        });

    </script>

</body>
</html>
