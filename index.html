        /* Upright / regular */

            font-display: swap;

            font-family: 'Mencken Std';

        /* ========================= ELEMENTS ========================= */

        const modal = document.getElementById('accessModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const backdrop = document.getElementById('modalBackdrop');
        const modalContent = document.getElementById('modalContent');
        const accessForm = document.getElementById('accessForm');
        const input = document.getElementById('secretInput');
        const errorText = document.getElementById('errorText');

        /* ========================= MODAL ========================= */

        function openModal() {
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            setTimeout(() => input.focus(), 100);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                accessForm.reset();
                input.classList.remove('border-red-400', 'text-red-500');
                errorText.classList.add('hidden');
            }, 300);
        }

        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        backdrop.addEventListener('click', closeModal);

        openBtn.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
        });

        /* ========================= AUTH ========================= */

        accessForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const btn = accessForm.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Verifying...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            const enteredCode = input.value.trim().toLowerCase();

            setTimeout(() => {
                if (ACCESS_CODES.includes(enteredCode)) {
                    btn.innerText = 'Access Granted';
                    sessionStorage.setItem("prive_access", "granted");
                    setTimeout(() => { window.location.href = REDIRECT_URL; }, 500);
                    return;
                }

                btn.innerText = originalText;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                input.classList.add('border-red-400', 'text-red-500');
                errorText.classList.remove('hidden');

                setTimeout(() => {

                    errorText.classList.add('hidden');
